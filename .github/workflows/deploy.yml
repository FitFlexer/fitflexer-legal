name: Deploy site

# Publishes page content to s3://fitflexer-prod-website and invalidates
# CloudFront. Infrastructure (bucket, CloudFront, DNS, cert, WAF) is owned by
# FitFlexerInfra — this workflow only writes files.
#
# Terraform owns /.well-known/* and /invite/*, which are templated from infra
# variables. The sync excludes them, and the deploy role is additionally DENIED
# write access to those prefixes in IAM, so a mistake here cannot clobber them.

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'assets/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token

env:
  AWS_REGION: us-east-2
  BUCKET: fitflexer-prod-website
  DISTRIBUTION_ID: E2AXTTWVPWPL7M

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail loudly rather than publishing a site with a missing page.
      - name: Verify expected files exist
        run: |
          set -euo pipefail
          missing=0
          for f in index.html privacy-policy.html terms-of-service.html eula.html \
                   404.html robots.txt sitemap.xml favicon.ico \
                   assets/logo-mark.png assets/favicon-32.png \
                   assets/favicon-64.png assets/apple-touch-icon.png; do
            [ -f "$f" ] || { echo "::error::missing $f"; missing=1; }
          done
          exit $missing

      # Catches a truncated or half-written page before it reaches users.
      - name: Check pages are well-formed and local links resolve
        run: |
          python3 - <<'PY'
          import html.parser, os, re, sys
          bad = False
          for page in ["index.html","privacy-policy.html","terms-of-service.html","eula.html","404.html"]:
              src = open(page, encoding="utf-8").read()
              class P(html.parser.HTMLParser):
                  def __init__(s): super().__init__(); s.stack=[]; s.err=[]
                  def handle_starttag(s,t,a):
                      if t not in ("meta","link","img","br","hr","input","source"): s.stack.append(t)
                  def handle_endtag(s,t):
                      if s.stack and s.stack[-1]==t: s.stack.pop()
                      elif t in s.stack: s.err.append(t)
              p = P(); p.feed(src)
              if p.stack or p.err:
                  print(f"::error::{page} has unbalanced tags: open={p.stack[:5]} mismatched={p.err[:5]}"); bad = True
              for ref in re.findall(r'(?:href|src)="([^"]+)"', src):
                  if ref.startswith(("http","mailto:","#","data:")): continue
                  target = ref.split("#")[0].split("?")[0]
                  if not target: continue
                  # Resolve the way CloudFront serves it: root-relative paths are
                  # bucket-relative, "/" is index.html, and an extensionless path
                  # maps to .html via the viewer-request function. 404.html uses
                  # root-relative links deliberately — it is served from arbitrary
                  # paths, where relative links would resolve wrong.
                  cand = target.lstrip("/") or "index.html"
                  if cand.endswith("/"): cand += "index.html"
                  if not os.path.exists(cand) and "." not in os.path.basename(cand):
                      cand += ".html"
                  if not os.path.exists(cand):
                      print(f"::error::{page} references missing file {ref}"); bad = True
          sys.exit(1 if bad else 0)
          PY

      # Asset filenames are stable (favicon-32.png etc.), so changing an image
      # leaves browsers holding a valid cached copy under an identical URL — a
      # new logo simply does not appear until max-age lapses, and favicons are
      # cached harder still. Appending a content hash makes the URL change
      # whenever the bytes do, which is what actually busts the cache.
      - name: Fingerprint asset URLs
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, re
          digests = {
              f.name: hashlib.md5(f.read_bytes()).hexdigest()[:8]
              for f in pathlib.Path("assets").iterdir() if f.is_file()
          }
          for page in pathlib.Path(".").glob("*.html"):
              src = page.read_text(encoding="utf-8")
              def stamp(m):
                  d = digests.get(m.group(1))
                  return f"assets/{m.group(1)}?v={d}" if d else m.group(0)
              out = re.sub(r"assets/([A-Za-z0-9._-]+)", stamp, src)
              if out != src:
                  page.write_text(out, encoding="utf-8")
                  print(f"fingerprinted {page}")
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # --delete keeps the bucket matching the repo, so a removed page actually
      # disappears. The two excludes are what keep it from deleting the
      # Terraform-managed files that are not in this repo's tree.
      - name: Sync to S3
        run: |
          aws s3 sync . "s3://${BUCKET}/" \
            --delete \
            --exclude '.git/*' \
            --exclude '.github/*' \
            --exclude 'docs/*' \
            --exclude 'README.md' \
            --exclude '.well-known/*' \
            --exclude 'invite/*' \
            --cache-control 'public, max-age=31536000, immutable'

          # HTML must never be immutable — it carries the fingerprints, so a
          # stale page would keep pointing at the old asset URLs. Re-upload it
          # with no-cache so browsers revalidate; the ETag keeps that cheap.
          for f in *.html; do
            aws s3 cp "$f" "s3://${BUCKET}/$f" \
              --cache-control 'no-cache' \
              --content-type 'text/html; charset=utf-8'
          done

      - name: Invalidate CloudFront
        run: |
          id=$(aws cloudfront create-invalidation \
                 --distribution-id "$DISTRIBUTION_ID" \
                 --paths '/*' --query 'Invalidation.Id' --output text)
          echo "invalidation $id"
          aws cloudfront wait invalidation-completed \
            --distribution-id "$DISTRIBUTION_ID" --id "$id"

      # Proves the deploy actually served, rather than trusting a green sync.
      - name: Verify live
        run: |
          set -euo pipefail
          fail=0
          # /invite/<token> and the assets are included deliberately: the invite
          # page is Terraform's but loads ITS logo and favicon from /assets/,
          # which this repo owns. Renaming an asset here breaks that page
          # silently — it did once, and this step was green throughout because
          # it only checked the pages this repo publishes.
          for path in / /privacy-policy.html /terms-of-service.html /eula.html \
                      /privacy-policy /terms-of-service /eula \
                      /invite/verify-token \
                      /assets/logo-mark.png /assets/favicon-32.png \
                      /assets/favicon-64.png /assets/apple-touch-icon.png \
                      /robots.txt /sitemap.xml /favicon.ico \
                      /.well-known/apple-app-site-association; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "https://fitflexer.com${path}")
            echo "$code  https://fitflexer.com${path}"
            [ "$code" = "200" ] || fail=1
          done

          # A missing path must be a real 404. S3 behind OAC returns 403
          # AccessDenied for an absent key, and a crawler reads that as an
          # access-restricted site — which is how Google reported this one as
          # "behind a login page". CloudFront maps it; this proves the mapping.
          miss=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 \
                   "https://fitflexer.com/definitely-not-a-real-page")
          echo "$miss  (missing path — expect 404, never 403)"
          [ "$miss" = "404" ] || fail=1

          exit $fail
